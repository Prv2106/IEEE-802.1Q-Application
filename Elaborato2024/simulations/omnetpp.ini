**.LD1.app[*].period = 1.4ms
**.LD1.app[*].deadlineRel = 1.4ms
**.LD1.app[*].payload = 1300B
**.LD1.app[*].priority = 7 # SR A

**.LD1.app[*].startTime = 1s
*.LD1.hasOutgoingStreams = true


